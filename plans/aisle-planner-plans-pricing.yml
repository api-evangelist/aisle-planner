specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Aisle Planner
providerId: aisle-planner
created: '2026-07-04'
modified: '2026-07-04'
reconciled: false
tags:
- Weddings
- Event Planning
- Business Management
- Plans
description: >-
  Aisle Planner Pro publishes standardized, tiered monthly subscription pricing
  on aisleplanner.com/pricing, gated primarily by the number of active client
  projects rather than by API/developer usage - there is no public developer
  API, so no separate API pricing exists. A "Sales Essentials" tier offers the
  lead/CRM and business tools without project management. All tiers include
  unlimited users, custom branding, personalized onboarding, and the Zapier
  integration. A minimum of two AP Connect (email/scheduling) seats is
  included, with additional seats billed separately. Annual billing gets a 10%
  discount versus monthly; a 30-day free trial (credit card required) is
  offered.
notes: >-
  Multiple third-party review sites (EventCertificate, GetApp, SaaSWorthy)
  quote slightly different tier prices and breakpoints than the vendor's own
  pricing page, likely reflecting promo pricing or page changes over time.
  This file reconciles to the prices and tiers observed directly on
  aisleplanner.com/pricing at review time; verify current rates before
  quoting, as vertical SaaS pricing pages change frequently.
sources:
- https://aisleplanner.com/pricing
- https://help.aisleplanner.com/en/articles/1899152-aisle-planner-subscription-plan-options
- https://www.eventcertificate.com/aisle-planner-pricing-plans/
plans:
- id: aisle-planner-sales-essentials
  name: Sales Essentials
  type: paid
  description: >-
    Sales and business management tools only - lead management, scheduling
    assistant, email integration, proposals, invoicing, and calendar - without
    the project management suite (timelines, budgets, guest/vendor manager,
    seating, event websites).
  entries:
  - label: Monthly Subscription
    name: sales_essentials_monthly
    type: flat
    metric: account
    limit: -1
    timeFrame: month
    geo: global
    unit: 1
    price: $49.99/month
    userMultiplied: false
  elements:
  - name: Lead Manager
  - name: Custom Contact Forms
  - name: Proposals and Contracts
  - name: Invoicing and Online Payments
  - name: AP Connect (min 2 seats)
  - name: Zapier Integration
