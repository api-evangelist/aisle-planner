name: Aisle Planner
kind: company
description: Aisle Planner is a cloud-based business management platform for wedding
  and event professionals - planners, venues, caterers, florists, and photographers -
  bundling lead management, proposals/contracts with e-signatures, invoicing and
  online payments, timelines, budgets, guest and vendor management, seating charts,
  event websites, and online RSVP into one system. Aisle Planner does NOT publish a
  public, self-service developer API. There is no developer portal, no public API
  reference, and no OpenAPI definition. The only "API key" Aisle Planner issues is a
  private per-account key found in Business Settings that plugs into a single
  pre-built Zapier integration - triggers are new project, new lead, and payment
  received; actions are create wedding project, create event project, and create
  lead - it is not a general-purpose, self-serve REST API a third-party developer
  can register for and call directly.
